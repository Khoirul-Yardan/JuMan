name: juman
description: JuMan - Encrypted Files Manager (Windows Desktop App)
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=2.19.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  file_picker: ^10.3.3
  open_filex: ^4.7.0
  sqflite: ^2.3.0
  flutter_secure_storage: ^10.0.0-beta.4
  provider: ^6.0.5
  lottie: ^3.3.2
  sqflite_common_ffi: ^2.3.6
  path: ^1.8.3
  encrypt: ^5.0.1
  crypto: ^3.0.2
  uuid: ^4.5.1
  cryptography: ^2.7.0
  google_sign_in: ^6.1.5
  googleapis: ^11.4.0
  http: ^1.1.0
  collection: ^1.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/animations/splash.json
    - assets/images/
